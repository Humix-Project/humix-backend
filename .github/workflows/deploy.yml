name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main에 push될 때 작동
  workflow_dispatch:

# 같은 서버(humix-prod)에 배포가 동시에 실행되면 컨테이너 교체 중 이름 충돌이 나므로 한 번에 하나만 실행한다.
# 진행 중인 배포는 도중에 끊지 않고, 대기 중이던 이전 실행은 최신 실행으로 대체된다 (마지막 커밋이 항상 반영됨).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 프로젝트 코드 가져오기
        uses: actions/checkout@v3

      - name: 2. JDK 21 환경 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Spring Boot 빌드 (jar 파일 생성)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 4. 메인 환경 변수 고정 설정
        run: |
          echo "ENV_NAME=prod" >> $GITHUB_ENV
          echo "APP_PORT=8080" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV

      - name: 5. 동적 .env 파일 생성 (환경 변수 파일)
        run: |
          echo "ENV=$ENV_NAME" >> .env
          echo "APP_PORT=$APP_PORT" >> .env
          echo "DB_PORT=$DB_PORT" >> .env
          echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env
          echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "JWT_COOKIE_SECURE=${{ secrets.JWT_COOKIE_SECURE }}" >> .env
          echo "JWT_COOKIE_SAME_SITE=${{ secrets.JWT_COOKIE_SAME_SITE }}" >> .env
          echo "AI_SERVER_URL=${{ vars.AI_SERVER_URL }}" >> .env
          echo "AI_GENERATION_SERVER_URL=${{ vars.AI_GENERATION_SERVER_URL }}" >> .env
          echo "RUNPOD_ENDPOINT_URL=${{ vars.RUNPOD_ENDPOINT_URL }}" >> .env
          echo "RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }}" >> .env
          echo "DEPLOY_TIME=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" >> .env

      - name: 6. EC2로 파일 전송 (jar, 도커 설정 파일 등)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 빌드된 jar와 도커 관련 파일, 환경변수 파일을 EC2로 복사
          source: "build/libs/*-SNAPSHOT.jar, Dockerfile, docker-compose.yml, .env, ai-cpu"
          target: "/home/${{ secrets.EC2_USERNAME }}/humix-${{ env.ENV_NAME }}"
          strip_components: 0

      - name: 7. EC2 접속 후 Docker 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USERNAME }}/humix-${{ env.ENV_NAME }}
            # 기존 컨테이너를 내리고, 새 이미지를 빌드하여 백그라운드에서 실행
            # 실패해도 아래 정리는 실행해야 하므로 종료 코드를 저장해 두었다가 마지막에 반환한다.
            # (그렇지 않으면 마지막 prune 명령의 성공이 단계 전체를 성공으로 만들어 배포 실패가 가려진다)
            deploy_status=0
            if docker compose version >/dev/null 2>&1; then
              docker compose --project-name humix-${{ env.ENV_NAME }} --env-file .env up --build -d || deploy_status=$?
            else
              docker-compose --project-name humix-${{ env.ENV_NAME }} --env-file .env up --build -d || deploy_status=$?
            fi
            # 사용하지 않는 이전 도커 이미지 및 빌드 캐시 전면 정리 (8GB 용량 부족 대비)
            # 정리 실패는 배포 결과에 영향을 주지 않도록 한다
            docker image prune -a -f || true
            docker builder prune -a -f || true
            exit $deploy_status